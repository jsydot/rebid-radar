body{background:#fff;color:#111;font-family:'Noto Sans KR','Malgun Gothic',-apple-system,'Segoe UI',sans-serif;font-size:14px}

function localDateKey(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}

  return;
 }

 if(q)rows=rows.filter(x=>(x.name+x.org).toLowerCase().includes(q));
 if(onlyNew)rows=rows.filter(x=>x.new);
 if(onlyStar)rows=rows.filter(x=>stars[x.no]);

 if(!rows.length){list.innerHTML='<div class="empty">조건에 맞는 공고가 없습니다</div>';return}

 for(const x of rows){

   lastWin=x.win;

   list.appendChild(gh);

  const dCls=d===null?"":d<=1?" hot":d<=4?" warn":"";

  const money=x.budgetRaw?x.budgetRaw.toLocaleString()+" ("+x.budget+")":x.budget;

  list.appendChild(el);
 }
}
document.getElementById("list").addEventListener("click",e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const no=b.dataset.no;
 if(b.dataset.a==="star"){stars[no]=!stars[no];if(!stars[no])delete stars[no];localStorage.setItem("rebidStars",JSON.stringify(stars))}
 else{hidden[no]=!hidden[no];if(!hidden[no])delete hidden[no];localStorage.setItem("rebidHidden",JSON.stringify(hidden))}
 render();
});
function setTab(t,updateHash=true){
 if(!SECT[t])return;
 typ=t;
 if(updateHash&&location.hash!==`#${t}`)location.hash=t;
 document.querySelectorAll("#typNav button").forEach(x=>x.classList.toggle("on",x.dataset.typ===t));
 document.getElementById("secTitle").textContent=SECT[t];
 document.getElementById("flags").hidden=t==="gov";
 document.getElementById("q").placeholder=t==="gov"?"과제명/기관을 입력해 주세요.":"공고명/수요기관을 입력해 주세요.";
 render();
}
document.getElementById("typNav").addEventListener("click",e=>{
 const c=e.target.closest("button");if(!c)return;
 setTab(c.dataset.typ);
});
document.getElementById("flags").addEventListener("click",e=>{
 const c=e.target.closest(".chip");if(!c)return;
 if(c.dataset.tier!==undefined){tier=c.dataset.tier;
  document.querySelectorAll(".tchip").forEach(x=>x.classList.toggle("on",x===c));render();return}
 if(c.id==="fNew"){onlyNew=!onlyNew;c.classList.toggle("on",onlyNew)}
 if(c.id==="fStar"){onlyStar=!onlyStar;c.classList.toggle("on",onlyStar)}
 if(c.id==="fHidden"){showHidden=!showHidden;c.classList.toggle("on",showHidden)}
 render();
});
document.getElementById("sort").addEventListener("change",e=>{sortBy=e.target.value;render()});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});
window.addEventListener("hashchange",()=>{
 const next=location.hash.replace("#","");
 if(SECT[next]&&next!==typ)setTab(next,false);
});
setTab(typ);
